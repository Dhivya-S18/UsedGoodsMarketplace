<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – ReUse</title>
  <meta name="description" content="Sign in to your ReUse account to browse, sell and discover pre-loved products.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="auth-layout">

    <!-- ===== Left: branding and visual ===== -->
    <aside class="auth-brand" aria-label="About ReUse">
      <div class="auth-brand-inner">
        <a class="logo" href="index.html" aria-label="ReUse home">
          <svg class="logo-icon" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="9" fill="currentColor"/>
            <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 13.5 14.2 8h3.6l1.6 2.8"/>
              <path d="m17.2 9.2 2.2 1.6-1.6 2.6"/>
              <path d="M23 15.5 21.4 21H15"/>
              <path d="m16.4 22.9-1.9-2 2-2.1"/>
              <path d="M9.8 18.4 8.6 14.5 12 14"/>
            </g>
          </svg>
          <span class="logo-text">ReUse</span>
        </a>

        <div class="auth-brand-copy">
          <h2 class="auth-brand-title">Welcome Back to ReUse.</h2>
          <p class="auth-brand-text">Find great deals, discover pre-loved essentials, and continue giving products a second life.</p>
        </div>

        <div class="auth-visual" role="presentation">
          <span class="auth-ring auth-ring-lg" aria-hidden="true"></span>
          <span class="auth-ring auth-ring-sm" aria-hidden="true"></span>

          <figure class="auth-tile auth-tile-main">
            <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=900&q=80" alt="Pre-owned sofa in a bright living room" width="900" height="675" loading="eager">
            <figcaption>Furniture</figcaption>
          </figure>
          <figure class="auth-tile auth-tile-laptop">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80" alt="Laptop on a desk" width="600" height="450" loading="eager">
            <figcaption>Electronics</figcaption>
          </figure>
          <figure class="auth-tile auth-tile-books">
            <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=500&q=80" alt="Stack of used books" width="500" height="500" loading="eager">
            <figcaption>Books</figcaption>
          </figure>
        </div>
      </div>
    </aside>

    <!-- ===== Right: login form ===== -->
    <main class="auth-panel" id="main-content">
      <div class="auth-panel-inner">

        <a class="back-link" href="index.html" id="back-home">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to Home
        </a>

        <section class="auth-card" aria-labelledby="login-title">
          <header class="auth-card-head">
            <h1 class="auth-title" id="login-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to continue to your ReUse account.</p>
          </header>

          <form class="auth-form" id="login-form" method="post" action="#" novalidate>

            <div class="form-group" id="email-group">
              <label class="form-label" for="email">Email Address</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 8 8 5.5L20 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input class="form-input" id="email" name="email" type="email" inputmode="email" placeholder="Enter your email address" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="email-error">
              </div>
              <p class="field-error" id="email-error" hidden></p>
            </div>

            <div class="form-group" id="password-group">
              <label class="form-label" for="password">Password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="4.5" y="10.5" width="15" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <input class="form-input has-toggle" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required aria-describedby="password-error">
                <button class="toggle-password" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false" aria-controls="password">
                  <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
                  <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" hidden><path d="M3 3l18 18M10.6 5.7A10 10 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 4M6.5 7.6A16.6 16.6 0 0 0 2 12s3.6 6.5 10 6.5c1.5 0 2.8-.3 4-.8M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <p class="field-error" id="password-error" hidden></p>
            </div>

            <div class="form-check">
              <input class="check-input" id="remember-me" name="remember" type="checkbox">
              <label class="check-label" for="remember-me">Remember me</label>
            </div>

            <!-- Inline form-level message (validation now; API errors later) -->
            <p class="form-message" id="login-message" role="alert" aria-live="assertive" hidden></p>

            <button class="btn btn-primary btn-block" id="login-submit" type="submit">Sign In</button>
          </form>

          <p class="auth-switch">
            Don't have an account? <a class="text-link" href="register.html" id="register-link">Create an account.</a>
          </p>
        </section>

        <nav class="auth-footer-nav" aria-label="Quick links">
          <a href="products.html">Browse Products</a>
          <a href="sell.html">Sell an Item</a>
        </nav>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var emailError = document.getElementById('email-error');
      var passwordError = document.getElementById('password-error');
      var message = document.getElementById('login-message');
      var toggleBtn = document.getElementById('toggle-password');
      var eyeOn = toggleBtn.querySelector('.icon-eye');
      var eyeOff = toggleBtn.querySelector('.icon-eye-off');

      var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      // Show or hide password
      toggleBtn.addEventListener('click', function () {
        var show = passwordInput.type === 'password';
        passwordInput.type = show ? 'text' : 'password';
        toggleBtn.setAttribute('aria-pressed', String(show));
        toggleBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        eyeOn.hidden = show;
        eyeOff.hidden = !show;
        passwordInput.focus();
      });

      function setFieldError(input, errorEl, text) {
        var group = input.closest('.form-group');
        if (text) {
          errorEl.textContent = text;
          errorEl.hidden = false;
          input.setAttribute('aria-invalid', 'true');
          group.classList.add('has-error');
        } else {
          errorEl.textContent = '';
          errorEl.hidden = true;
          input.removeAttribute('aria-invalid');
          group.classList.remove('has-error');
        }
      }

      function showMessage(text) {
        if (text) {
          message.textContent = text;
          message.hidden = false;
        } else {
          message.textContent = '';
          message.hidden = true;
        }
      }

      function validateEmail() {
        var value = emailInput.value.trim();
        if (!value) {
          setFieldError(emailInput, emailError, 'Enter your email address.');
          return false;
        }
        if (!EMAIL_PATTERN.test(value)) {
          setFieldError(emailInput, emailError, 'Enter a valid email address, like name@example.com.');
          return false;
        }
        setFieldError(emailInput, emailError, '');
        return true;
      }

      function validatePassword() {
        if (!passwordInput.value) {
          setFieldError(passwordInput, passwordError, 'Enter your password.');
          return false;
        }
        setFieldError(passwordInput, passwordError, '');
        return true;
      }

      // Re-check a field after the user has left it, and clear errors as they fix them
      emailInput.addEventListener('blur', function () { if (emailInput.value) validateEmail(); });
      passwordInput.addEventListener('input', function () { if (!passwordError.hidden) validatePassword(); });
      emailInput.addEventListener('input', function () { if (!emailError.hidden) validateEmail(); });

      form.addEventListener('submit', function (event) {
        // Always stop the default submit; backend integration happens in a later step.
        event.preventDefault();
        showMessage('');

        var emailOk = validateEmail();
        var passwordOk = validatePassword();

        if (!emailOk || !passwordOk) {
          showMessage('Please fix the highlighted fields and try again.');
          (emailOk ? passwordInput : emailInput).focus();
          return;
        }

        /*
          Backend integration (FastAPI login endpoint) goes here.
          Read values with:
            emailInput.value.trim(), passwordInput.value,
            document.getElementById('remember-me').checked
          Use showMessage('...') to display server errors in #login-message.
        */
      });
    })();
  </script>
  <script src="js/config.js?v=20261112-tab-session"></script>
  <script src="js/auth.js?v=20261112-access"></script>
</body>
</html>
